#########################################
### Em produção vamos usar Amazon RDS ###
#########################################

#Criando a network
networks:
  saudepraja-network:
    driver: bridge

volumes:
  mysql-volume:

#Criando serviços (containers)
services:
  saudepraja-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    #SAIDA:INTERNA(CONTAINER)
    ports:
      - "3307:3306"
    volumes:
      - mysql-volume:/var/lib/mysql
    networks:
      - saudepraja-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  #Container da api
  saudepraja-api:
    image: saudepraja-api
    # Execução dos comandos para iniciação do container
    environment:
      DB_HOST: ${DB_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      S3_STORAGE_KEY: ${S3_STORAGE_KEY}
      S3_STORAGE_KEY_PASSWORD: ${S3_STORAGE_KEY_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - saudepraja-network
    depends_on:
      saudepraja-mysql:
        condition: service_healthy

  saudepraja-proxy:
    build: ./nginx
    image: saudepraja-proxy
    ports:
      - "80:80"
    networks:
      - saudepraja-network
    depends_on:
      - saudepraja-api